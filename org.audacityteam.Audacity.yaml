app-id: org.audacityteam.Audacity
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: audacity
rename-icon: audacity
rename-mime-file: audacity.xml
finish-args:
  - --share=ipc
  - --socket=x11
  - --share=network
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=host
  - --filesystem=xdg-run/pipewire-0:ro
  - --env=ALSA_CONFIG_PATH=
add-extensions:
  org.freedesktop.LinuxAudio.Plugins:
    directory: extensions/Plugins
    version: '25.08'
    add-ld-path: lib
    merge-dirs: lv2;vst3
    subdirectories: true
    no-autodownload: true
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/aclocal
  - /share/man
  - '*.la'
  - '*.a'
modules:
  - name: patchelf
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0.tar.bz2
        sha256: 1952b2a782ba576279c211ee942e341748fdb44997f704dd53def46cd055470b
  - name: audacity
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      env:
        EXTDEPS_CACHE: /run/build/audacity/offline-deps
        CMAKE_BUILD_PARALLEL_LEVEL: '8'
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DAU4_BUILD_MODE=release
      - -DAU4_BUILD_CONFIGURATION=app
      - -DEXTDEPS_OVERRIDE_ALL=SYSTEM
      - -DEXTDEPS_OVERRIDE_WXWIDGETS=REBUILD
      - -DEXTDEPS_OVERRIDE_PORTAUDIO=REBUILD
      - -DEXTDEPS_OVERRIDE_LAME=REBUILD
      - -DEXTDEPS_OVERRIDE_PUGIXML=REBUILD
      - -DEXTDEPS_OVERRIDE_UTFCPP=REBUILD
      - -DMUSE_ENABLE_UNIT_TESTS=OFF
      - -DMUSE_MODULE_DIAGNOSTICS_CRASHPAD_CLIENT=OFF
      - -DMUSE_MODULE_UPDATE=OFF
      - -DMUSE_COMPILE_USE_CCACHE=OFF
    post-install:
      - mv /app/bin/audacity /app/bin/audacity.bin
      - install -Dm755 ../audacity.sh /app/bin/audacity
      - install -d /app/extensions/Plugins
      - desktop-file-edit --set-name=Audacity --set-key=Exec --set-value='audacity %F' /app/share/applications/org.audacityteam.Audacity.desktop
    sources:
      - type: archive
        url: https://github.com/audacity/audacity/releases/download/Audacity-4.0.0/audacity-sources-4.0.0.tar.xz
        sha256: b29076f99fa5d2f522d001db472a896db81f9effefd15948c940571753858058
      - type: patch
        paths:
          - patches/audacity4/0001-wxbase-use-sdk-libraries.patch
          - patches/audacity4/0002-discover-flatpak-vst3-extensions.patch
          - patches/audacity4/0003-fix-release-metadata.patch
      - type: script
        dest-filename: audacity.sh
        commands:
          - export LV2_PATH=$HOME/.lv2:/app/extensions/Plugins/lv2:/app/lib/lv2
          - exec /app/bin/audacity.bin "$@"
